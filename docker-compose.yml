version: "3.8"
services:
  db:
    build:
      context: ./Base de Datos
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${SA_PASSWORD}
      - SA_USER=${SA_USER}
      - MSSQL_PID=${MSSQL_PID}
    ports:
      - "1433:1433"
    volumes:
      - dbdata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U ${SA_USER} -P ${SA_PASSWORD} -Q \"SELECT 1\" >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./Codigo/AutoAlertBackEnd
    depends_on:
      - db
    env_file:
      - .env
    environment:
      - ConnectionStrings__SQLConnectionStrings=Server=db,1433;Database=${DB_NAME};User Id=${SA_USER};Password=${SA_PASSWORD};TrustServerCertificate=True;
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "5162:80"

  frontend:
    build: ./Codigo/AutoAlertFrontend
    ports:
      - "3000:3000"

volumes:
  dbdata: